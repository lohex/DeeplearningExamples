[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplearning-examples"
version = "0.1.0"
description = "Deep-learning examples for biological time-course and image data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aeon>=1.3,<1.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
tuning = [
    "optuna>=4.0",
]
bbbc021 = [
    "pillow>=9.5",
    "requests>=2.28",
    "tqdm>=4.64",
]
all = [
    "pillow>=9.5",
    "requests>=2.28",
    "torch>=2.0",
    "optuna>=4.0",
    "tqdm>=4.64",
]

[tool.setuptools]
packages = [
    "deeplearning_examples",
    "pytorch_cdgan",
    "pytorch_timecourse_classification",
    "pytorch_timecourse_classification.models",
    "bbbc021_morphology_classification",
]

[tool.setuptools.package-dir]
deeplearning_examples = "src/deeplearning_examples"
pytorch_cdgan = "projects/pytorch_cdgan/src/pytorch_cdgan"
pytorch_timecourse_classification = "projects/pytorch_timecourse_classification/src/pytorch_timecourse_classification"
"pytorch_timecourse_classification.models" = "projects/pytorch_timecourse_classification/src/pytorch_timecourse_classification/models"
bbbc021_morphology_classification = "projects/bbbc021_morphology_classification/src/bbbc021_morphology_classification"
